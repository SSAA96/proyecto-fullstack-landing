<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowly — Organiza el trabajo de tu equipo</title>
  <meta name="description" content="Flowly es la plataforma para organizar tareas, automatizar el trabajo repetitivo y ver el progreso de tu equipo en tiempo real.">
 
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap%22 rel="stylesheet">
 
  <!-- Bootstrap 5 vía CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
  <!-- CSS -->
  <link href="css/custom.css" rel="stylesheet">
</head>
  <body>
  <!-- ============ HEADER / NAVBAR ============
       Componente Bootstrap #1: navbar responsive con menú colapsable en mobile.
       Los links usan anclas (#hero, #features, ...) porque el sitio es de una sola página. -->
  <header>

    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#hero">
          <img src="img/logo.svg" alt="Logo de Flowly" width="32" height="32">
          <span>Flowly</span>
        </a>
 
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú de navegación">
          <span class="navbar-toggler-icon"></span>
        </button>
 
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="#features">Features</a></li>
            <li class="nav-item"><a class="nav-link" href="#testimonios">Testimonios</a></li>
            <li class="nav-item"><a class="nav-link" href="#pricing">Precios</a></li>
            <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
            <li class="nav-item">
              <!--
                Botón de modo oscuro. NO usa atributos data-bs-*: el comportamiento
                lo escribimos nosotros en js/main.js (evento JS propio #1).
              -->
              <button id="theme-toggle" class="btn btn-outline-light btn-sm ms-lg-2" type="button" aria-pressed="false">
                <span id="theme-toggle-icon" aria-hidden="true">🌙</span>
                <span class="visually-hidden">Cambiar a modo oscuro</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
 </body>
